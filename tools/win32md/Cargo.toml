[package]
name = "win32md"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tables for sake's tests from Microsoft's Win32 metadata (microsoft/win32metadata's Windows.Win32.winmd)"

# (its own workspace: the metadata reader stays out of the main one's builds)
[workspace]

[dependencies]
windows-metadata = "=0.100.0"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
