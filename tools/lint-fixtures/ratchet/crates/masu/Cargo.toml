[package]
name = "masu-lint-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# (named masu: clippy.toml's `masu::storage::Storage::get` resolves in it)
[lib]
name = "masu"
path = "src/lib.rs"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
