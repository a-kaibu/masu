[package]
name = "wmcodec"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
# a port of FFmpeg's decoders, and so under FFmpeg's license
license = "LGPL-2.1-or-later"
description = "Windows Media decoders (WMA 1/2, MS-MPEG4 / WMV 1/2, WMV 3 / VC-1) ported from FFmpeg 7.1 to Rust, for sake's wmvcore readers and decoder DMOs"

[dependencies]
kome = { path = "../kome" }

[dev-dependencies]
asf = { path = "../asf" }
proptest = "1"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
