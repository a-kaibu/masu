[package]
name = "hlslc"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "HLSL compiler: source to DXBC (shader model 4/5), Direct3D 9 bytecode (2/3) and fx_2_0 effects; Direct3D 9 shader assembler"

[dependencies]
kome = { path = "../kome" }
# (the SM4/5 opcode table: one enum for the compiler that writes the tokens and the translator
# that reads them)
dxwgsl = { path = "../dxwgsl" }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
# (masu_sanitize: tools/ci/sanitize.sh's builds, #242)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(masu_sanitize)"] }
