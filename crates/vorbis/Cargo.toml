[package]
name = "vorbis"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "Vorbis I audio decoding (headers, codebooks, floor 1, residues, coupling, IMDCT), written to match libvorbis's output, for sake to take over games' own x86 Vorbis decoders"

[dependencies]
kome = { path = "../kome" }

[dev-dependencies]
proptest = "1"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
