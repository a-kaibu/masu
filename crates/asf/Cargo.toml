[package]
name = "asf"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "Advanced Systems Format (ASF: .wmv / .wma / .asf) demuxing, for sake's Windows Media Format SDK readers (wmvcore)"

[dependencies]
kome = { path = "../kome" }

[dev-dependencies]
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
