[package]
name = "kome"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The small typed pieces every masu crate used to copy: named numeric conversions, little-endian reads, lock helpers, golden-file tests"

[dependencies]

[dev-dependencies]
proptest = "1"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
