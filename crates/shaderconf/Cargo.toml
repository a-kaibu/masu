[package]
name = "shaderconf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Shader conformance cases: HLSL (DXBC, D3D9 bytecode), D3D9 assembly and GLSL through masu's translators to WGSL, with the results the Direct3D and OpenGL rules give (tests/shaders.mjs runs them on WebGPU)"

[dependencies]
kome = { path = "../kome" }
hlslc = { path = "../hlslc" }
dxwgsl = { path = "../dxwgsl" }
glwgsl = { path = "../glwgsl" }
half = "2"
naga = { version = "30", features = ["wgsl-in"] }

[lints.rust]
# (unsafe operations in an unsafe fn without an unsafe block: edition 2024 warns; tools/ci/
# lint-ratchet.py counts them per file instead, so they only go down)
unsafe_op_in_unsafe_fn = "allow"
