[package]
name = "foresee"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "What a game reads next, foreseen from its scripts: archive indexes (KiriKiri .xp3), script text, the names in it, and per-tree tables of them"

[dependencies]
kome = { path = "../kome" }
miniz_oxide = "0.8"

[dev-dependencies]
proptest = "1"

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
