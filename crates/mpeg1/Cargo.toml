[package]
name = "mpeg1"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "MPEG-1 system streams (ISO/IEC 11172-1), video (11172-2) and audio layer II (11172-3) decoding, a port of pl_mpeg, for sake's DirectShow MPEG-1 splitter and decoders"

[dependencies]
kome = { path = "../kome" }

[dev-dependencies]
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
# (unsafe operations in an unsafe fn without an unsafe block: edition 2024 warns; tools/ci/
# lint-ratchet.py counts them per file instead, so they only go down)
unsafe_op_in_unsafe_fn = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
