[package]
name = "koji"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "x86 user-mode CPU core: interpreter and x86->wasm JIT"

[dependencies]
kome = { path = "../kome" }
iced-x86 = { version = "1.21", default-features = false, features = ["no_std", "decoder", "instr_info", "fast_fmt"] }
libm = "0.2"

[dev-dependencies]
flate2 = "1"
proptest = "1"
# (the JIT's modules validated in the property tests)
wasmparser = "0.263"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dev-dependencies]
libc = "0.2"
iced-x86 = { version = "1.21", default-features = false, features = ["no_std", "decoder", "instr_info", "encoder", "code_asm", "nasm", "op_code_info"] }

[lints.rust]
# (unsafe operations in an unsafe fn without an unsafe block: edition 2024 warns; tools/ci/
# lint-ratchet.py counts them per file instead, so they only go down)
unsafe_op_in_unsafe_fn = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
