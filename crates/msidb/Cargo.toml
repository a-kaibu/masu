[package]
name = "msidb"
version = "0.1.0"
edition.workspace = true
# (a workspace crate, never published: cargo-deny lets its path dependencies be)
publish = false
license.workspace = true
description = "Windows Installer databases (.msi): the compound file's tables, string pool, streams and summary information, MSI SQL views, records, MsiFormatRecord and conditions; for sake's msi.dll and masu's own unpacking"

[dependencies]
cfb = "0.16"
encoding_rs = "0.8"
kome = { path = "../kome" }
uuid = "1"

[dev-dependencies]
# (no fork or timeout: the tests also run on wasm32, formal/wasm32.sh)
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
# (Rust 1.99: `&x as *const T` / `&mut x as *mut T` makes a reference first, with its aliasing
# rules: write `&raw const x` / `&raw mut x`, or Box::as_ptr)
raw_borrows_via_references = "warn"
