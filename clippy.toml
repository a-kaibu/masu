# (masu-lint ratchet, crates/masu-lint: tests may unwrap; the code they test may not)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# (kura::guest::Ga, named as clippy prints it inside sake: a guest address, whose + and - wrap at
# 4 GiB as the x86's do, by design)
# (kura::d3d11::tess::N, the tessellator's counts and indices: the reference's C ints, + - *
# wrap, small by construction)
arithmetic-side-effects-allowed = ["kura::guest::Ga", "guest::Ga", "kura::d3d11::tess::N", "d3d11::tess::N"]
# (masu-lint ratchet counts these per file under the masu-* name each reason starts with: unsafe
# functions named by their type, not by a text search)
disallowed-methods = [
    { path = "alloc::vec::Vec::set_len", reason = "masu-set_len: Vec::resize / truncate / a typed buffer" },
    { path = "core::slice::from_raw_parts", reason = "masu-from_raw_parts: a Range or a typed view (sake::mem::view)" },
    { path = "core::slice::from_raw_parts_mut", reason = "masu-from_raw_parts: a Range or a typed view (sake::mem::view_mut)" },
    { path = "core::intrinsics::transmute", reason = "masu-transmute: from_le_bytes / a safe cast" },
    { path = "core::mem::transmute_copy", reason = "masu-transmute: from_le_bytes / a safe cast" },
    { path = "core::mem::zeroed", reason = "masu-uninit: Default / a value" },
    { path = "core::mem::MaybeUninit::assume_init", reason = "masu-uninit: a value made whole" },
    # (61153f30: GetProcAddress leaked its name per call; review 2026-11-16: the api hot table's
    # per-call Box made LSan's 6000 leaks. A leak is right once per process, a known site; any new
    # one says which it is)
    { path = "alloc::boxed::Box::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
    { path = "alloc::string::String::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
    { path = "alloc::vec::Vec::leak", reason = "masu-leak: an owner (a static OnceLock, a table entry) or a borrow" },
    # (no relay, 2026-11-16: the page reads chunks from the bucket itself; each place the server
    # reads an object's bytes is a known site, a new one is a new relay. Only crate masu has it)
    { path = "masu::storage::Storage::get", reason = "masu-relay: the page fetches from the bucket (/store-direct); the server reads only the catalog", allow-invalid = true },
]
